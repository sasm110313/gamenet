# GameNet cloud Redis: WSS fan-out only. No persistence, no eviction of live
# channel messages. Installed over the stock Ubuntu redis.conf.
bind 127.0.0.1
protected-mode yes
port 6379
supervised systemd
daemonize no
dir /var/lib/redis
maxmemory 48mb
maxmemory-policy noeviction
save ""
appendonly no
loglevel notice
